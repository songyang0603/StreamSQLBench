name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: data-curation/pyproject.toml
      - name: Install
        working-directory: data-curation
        run: python -m pip install -e '.[test]'
      - name: Test
        working-directory: data-curation
        run: python -m pytest -q
      - name: Validate frozen release structure
        working-directory: data-curation
        run: python scripts/validate_release.py ../benchmark

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: StreamSQLAgent/requirements.txt
      - name: Install frozen Agent dependencies
        run: python -m pip install -r StreamSQLAgent/requirements.txt pytest
      - name: Verify the agent code against the paper run
        run: python StreamSQLAgent/provenance/verify.py
      - name: Verify frozen source inventory
        run: python StreamSQLAgent/scripts/verify_release.py
      - name: Test Agent offline
        working-directory: StreamSQLAgent
        run: python -m pytest tests -q

  ex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evaluation/requirements.txt
      - name: Install EX dependencies
        run: python -m pip install -r evaluation/requirements.txt pytest==9.1.1
      - name: Verify paper EX and 402 contracts
        run: python evaluation/evaluate.py --check
      - name: Recompute the paper's accuracy tables from released results
        run: python results/summarize.py
      - name: Test EX without models or runtime services
        run: python -m pytest evaluation/tests -q
      - name: Test source rebuild and input preparation offline
        run: python -m pytest reproduction/tests -q
