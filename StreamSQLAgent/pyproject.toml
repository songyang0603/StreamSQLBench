[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsqlagent"
version = "1.0.0"
description = "Contract-guarded streaming SQL verification and repair"
requires-python = ">=3.11,<3.14"
dependencies = ["sqlglot==30.15.0", "pandas==3.0.5", "duckdb==1.5.5"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["streamsqlagent*"]

[tool.setuptools.package-data]
streamsqlagent = ["prompts/*.md"]
